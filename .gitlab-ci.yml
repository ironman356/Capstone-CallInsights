stages:
  - test
  - deploy

frontend-build:
  stage: test
  script:
    - Set-Location apps/web
    - npm.cmd ci
    - npm.cmd run build
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

pages:
  stage: deploy
  script:
    - Set-Location apps/web
    - npm.cmd ci
    - npm.cmd run build
    - Set-Location ../..
    - New-Item -ItemType Directory -Force -Path public/app | Out-Null
    - Copy-Item -Path apps/web/dist/* -Destination public/app -Recurse -Force
    - Copy-Item -Path docs/assets -Destination public/assets -Recurse -Force
    - Copy-Item -Path docs/beta-demo.html -Destination public/index.html -Force
    - Copy-Item -Path docs/beta-demo-script.md -Destination public/beta-demo-script.md -Force
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
